[package]
name = "proof-of-study"
version = "0.3.0"
description = "Banco de horas de estudo com pomodoro que registra o foco"
authors = ["Mizerski"]
license = ""
repository = "https://github.com/Mizerski/Proof-of-Study"
edition = "2024"
rust-version = "1.90"

[lib]
name = "proof_of_study_lib"
# Só desktop: sem "staticlib" (que serve ao iOS e gerava um .lib de centenas de MB a cada build).
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tauri = { version = "2.12.0", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
# Voz transcrita no PC (recurso opcional de compilação: sem ele, o relato é só texto). Precisa de CMake e do
# libclang (LLVM) para gerar as bindings do whisper.cpp; o CI e a release compilam com ela.
whisper-rs = { version = "0.16", optional = true }
cpal = { version = "0.18", optional = true }
sha2 = { version = "0.11", optional = true }
# Cliente HTTP (rustls) das chamadas ao Gemini.
ureq = "3"
# Cofre do sistema para a chave do Gemini: Gerenciador de Credenciais no Windows, Secret Service no Linux.
keyring = "4"

[features]
default = []
voz = ["dep:whisper-rs", "dep:cpal", "dep:sha2"]

[target.'cfg(windows)'.dependencies]
# Título da janela ativa, nome do programa e tempo sem mexer no teclado e mouse.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
# Janela ativa e tempo sem uso pelo X11 (Rust puro, sem libX11). A extensão screensaver dá o tempo sem uso.
x11rb = { version = "0.13", features = ["screensaver"] }
